modLoader = "javafml"
loaderVersion = "${neoforge_loader_version}"
issueTrackerURL = "https://go.ftb.team/support-mod-issues"
license = "All Rights Reserved"

[[mixins]]
config = "ftbteambases.mixins.json"

[[mods]]
modId = "ftbteambases"
version = "${version}"
displayName = "FTB Team Bases"
authors = "FTB Team"
description = '''
An extension to FTB Teams to provide multi-dimension support for FTB modpacks
'''
#logoFile = ""

[[dependencies.ftbteambases]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.ftbteambases]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.ftbteambases]]
modId = "ftbteams"
type = "required"
versionRange = "${ftb_teams_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.ftbteambases]]
modId = "ftblibrary"
type = "required"
versionRange = "${ftb_library_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.ftbteambases]]
modId = "ftbchunks"
type = "optional"
versionRange = "${ftb_chunks_version_range}"
ordering = "AFTER"
side = "BOTH"